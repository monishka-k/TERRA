[project]
name = "pipeline"
version = "0.1.0"
description = "ETL and ML pipeline, layers L0-L4."
requires-python = ">=3.11"
dependencies = [
  "core",
  "h3>=4.1",
  "geopandas>=1.0",
  "rasterio>=1.3",
  "rioxarray>=0.17",
  "xarray>=2024.6",
  "netCDF4>=1.7",
  "exactextract>=0.2",
  "pysheds>=0.4",
  "xgboost>=2.1",
  "scikit-learn>=1.5",
  "shap>=0.46",
  "ortools>=9.10",
  "pystac-client>=0.8",
  "odc-stac>=0.3",
  "planetary-computer>=1.0",
  "httpx>=0.27",
  "apscheduler>=3.10",
  "pandas>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "matplotlib>=3.8",
  "joblib>=1.3",
  "numpy>=1.26",
  "pyproj>=3.6",
]

[tool.uv.sources]
core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
